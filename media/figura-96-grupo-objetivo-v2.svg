<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1800" viewBox="0 0 1440 1800" role="img" aria-labelledby="title desc">
  <title id="title">Perfil del grupo objetivo del proyecto</title>
  <desc id="desc">Infografía editorial que resume la definición del público meta: jóvenes adultos de 18 a 30 años en áreas urbanas y periurbanas de la Ciudad de Guatemala, el reto cotidiano asociado con clutter, consumo impulsivo y rutinas inestables, y el enfoque de organización, minimalismo y autogestión del espacio.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#100c15"/><stop offset=".55" stop-color="#191020"/><stop offset="1" stop-color="#110d18"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d283ff"/><stop offset="1" stop-color="#8e3cc3"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8ee8d3"/><stop offset="1" stop-color="#4dbaa9"/></linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffbd9b"/><stop offset="1" stop-color="#ed7d76"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#fff" stroke-opacity=".035" stroke-width="1"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="42"/></filter>
    <style>
      .sans{font-family:'DM Sans','Arial',sans-serif}.display{font-family:'Manrope','Arial',sans-serif}.eyebrow{font-size:20px;letter-spacing:4px;font-weight:700}.small{font-size:22px}.body{font-size:28px}.label{font-size:21px;font-weight:700;letter-spacing:2.5px}.cardtitle{font-size:32px;font-weight:700}.muted{fill:#c9bdd3}.white{fill:#fff9ff}
    </style>
  </defs>
  <rect width="1440" height="1800" fill="url(#bg)"/>
  <rect width="1440" height="1800" fill="url(#grid)"/>
  <circle cx="1260" cy="270" r="210" fill="#963fc2" opacity=".16" filter="url(#glow)"/>
  <circle cx="200" cy="1040" r="190" fill="#48c5ab" opacity=".10" filter="url(#glow)"/>

  <g class="sans">
    <text x="92" y="104" class="eyebrow" fill="#d283ff">PROYECTO DE GRADO  ·  1.5 GRUPO OBJETIVO</text>
    <path d="M92 138H1348" stroke="#c38be0" stroke-opacity=".4" stroke-width="2"/>
    <text x="92" y="250" class="display white" font-size="76" font-weight="800" letter-spacing="-3">¿Para quién se diseña?</text>
    <text x="96" y="304" class="body muted">Una definición de público meta. No es una infografía de resultados.</text>

    <!-- Audience definition -->
    <rect x="80" y="366" width="1280" height="434" rx="34" fill="#21182a" stroke="#624071" stroke-width="2"/>
    <rect x="80" y="366" width="14" height="434" rx="7" fill="url(#violet)"/>
    <text x="130" y="426" class="label" fill="#d283ff">01  /  PERFIL META</text>
    <text x="126" y="568" class="display white" font-size="118" font-weight="800" letter-spacing="-6">18–30</text>
    <text x="134" y="618" class="sans white" font-size="31" font-weight="700">jóvenes adultos</text>
    <rect x="130" y="664" width="492" height="2" fill="#594365"/>
    <circle cx="145" cy="714" r="8" fill="#8ee8d3"/>
    <text x="170" y="723" class="small white">Áreas urbanas y periurbanas</text>
    <circle cx="145" cy="760" r="8" fill="#ffbd9b"/>
    <text x="170" y="769" class="small white">Ciudad de Guatemala</text>

    <!-- Geometric city/home illustration -->
    <g transform="translate(760 410)">
      <circle cx="274" cy="164" r="145" fill="#2d2036" stroke="#51375f" stroke-width="2"/>
      <circle cx="274" cy="164" r="111" fill="none" stroke="#d283ff" stroke-opacity=".27" stroke-width="2" stroke-dasharray="4 12"/>
      <path d="M110 300V171l164-115 164 115v129" fill="#17111e" stroke="#bd83d7" stroke-width="5" stroke-linejoin="round"/>
      <path d="M157 300V190l117-81 117 81v110" fill="#261b30" stroke="#6e4b80" stroke-width="3" stroke-linejoin="round"/>
      <rect x="245" y="216" width="58" height="84" rx="5" fill="#422f50" stroke="#d283ff" stroke-width="3"/>
      <rect x="178" y="204" width="42" height="42" rx="4" fill="#8ee8d3" fill-opacity=".7"/>
      <rect x="327" y="204" width="42" height="42" rx="4" fill="#ffbd9b" fill-opacity=".75"/>
      <path d="M70 301h408" stroke="#a17cac" stroke-width="5" stroke-linecap="round"/>
      <path d="M84 331h380" stroke="#6d5377" stroke-width="3" stroke-linecap="round"/>
      <path d="M95 356h350" stroke="#4b3a53" stroke-width="2" stroke-linecap="round"/>
      <circle cx="436" cy="102" r="32" fill="url(#mint)"/>
      <path d="M423 103l9 9 18-22" fill="none" stroke="#15201f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="1034" y="768" text-anchor="middle" class="sans" font-size="19" fill="#c9bdd3">El espacio cotidiano como contexto</text>

    <!-- Challenge -->
    <text x="92" y="890" class="label" fill="#8ee8d3">02  /  RETOS DESCRITOS EN EL PROYECTO</text>
    <g>
      <rect x="80" y="928" width="397" height="276" rx="26" fill="#19141f" stroke="#44334d" stroke-width="2"/>
      <circle cx="136" cy="994" r="28" fill="#3e2b4c"/><path d="M121 994h30m-24-10 17 20m0-20-17 20" stroke="#d283ff" stroke-width="4" stroke-linecap="round"/>
      <text x="122" y="1061" class="cardtitle white">Saturación</text>
      <text x="122" y="1105" class="small muted">por acumulación</text>
      <path d="M122 1146h235" stroke="#68467a" stroke-width="3" stroke-linecap="round"/>
      <text x="122" y="1180" class="sans" font-size="18" fill="#a899b1">Acumulación y desorden</text>

      <rect x="521" y="928" width="397" height="276" rx="26" fill="#19141f" stroke="#44334d" stroke-width="2"/>
      <circle cx="577" cy="994" r="28" fill="#382f2c"/><path d="M562 1001h30l-3-20h-24zM568 1004a4 4 0 1 0 0 8m17-8a4 4 0 1 0 0 8M572 981l-4-8h-7" fill="none" stroke="#ffbd9b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="563" y="1061" class="cardtitle white">Consumo</text>
      <text x="563" y="1105" class="small muted">impulsivo</text>
      <path d="M563 1146h235" stroke="#8b5b51" stroke-width="3" stroke-linecap="round"/>
      <text x="563" y="1180" class="sans" font-size="18" fill="#a899b1">Vinculado al consumo</text>

      <rect x="962" y="928" width="397" height="276" rx="26" fill="#19141f" stroke="#44334d" stroke-width="2"/>
      <circle cx="1018" cy="994" r="28" fill="#253b39"/><rect x="1004" y="979" width="28" height="30" rx="4" fill="none" stroke="#8ee8d3" stroke-width="3"/><path d="M1010 987h16m-16 8h16m-16 8h10" stroke="#8ee8d3" stroke-width="2.5" stroke-linecap="round"/>
      <text x="1004" y="1061" class="cardtitle white">Rutinas</text>
      <text x="1004" y="1105" class="small muted">inestables</text>
      <path d="M1004 1146h235" stroke="#467d72" stroke-width="3" stroke-linecap="round"/>
      <text x="1004" y="1180" class="sans" font-size="18" fill="#a899b1">Organización cotidiana</text>
    </g>

    <!-- Design response -->
    <rect x="80" y="1260" width="1280" height="388" rx="34" fill="#21182a" stroke="#624071" stroke-width="2"/>
    <path d="M80 1294q0-34 34-34h1212q34 0 34 34v9H80z" fill="url(#violet)" opacity=".88"/>
    <text x="128" y="1370" class="label" fill="#d283ff">03  /  ENFOQUE DE DISEÑO</text>
    <text x="128" y="1444" class="display white" font-size="43" font-weight="800">Apoyar el bienestar emocional</text>
    <text x="128" y="1496" class="display white" font-size="43" font-weight="800">y la funcionalidad cotidiana.</text>
    <g>
      <rect x="128" y="1540" width="300" height="62" rx="31" fill="#382747" stroke="#8d5fa3"/>
      <text x="278" y="1580" text-anchor="middle" class="sans white" font-size="22" font-weight="700">Organización</text>
      <rect x="450" y="1540" width="300" height="62" rx="31" fill="#253a37" stroke="#4d9788"/>
      <text x="600" y="1580" text-anchor="middle" class="sans white" font-size="22" font-weight="700">Minimalismo</text>
      <rect x="772" y="1540" width="520" height="62" rx="31" fill="#3a2927" stroke="#a45d59"/>
      <text x="1032" y="1580" text-anchor="middle" class="sans white" font-size="22" font-weight="700">Autogestión del espacio</text>
    </g>
    <path d="M92 1694H1348" stroke="#765b80" stroke-opacity=".6" stroke-width="2"/>
    <circle cx="103" cy="1738" r="7" fill="#d283ff"/>
    <text x="124" y="1746" class="sans" font-size="19" fill="#c9bdd3">Perfil meta del proyecto · No presenta resultados estadísticos ni porcentajes de encuesta.</text>
  </g>
</svg>
