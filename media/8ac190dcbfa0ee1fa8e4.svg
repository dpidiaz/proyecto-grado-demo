<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Tres enfoques del minimalismo</title><desc id="desc">Síntesis conceptual de los enfoques de Marie Kondo, Joshua Becker y Fumio Sasaki descritos en el análisis del proyecto.</desc><rect width="1200" height="700" rx="28" fill="#170f1b"/><rect x="2" y="2" width="1196" height="696" rx="26" fill="none" stroke="#563767" stroke-width="3"/><text x="56" y="70" fill="#c875ff" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="3">SÍNTESIS CONCEPTUAL</text><text x="56" y="125" fill="#f5edf8" font-family="Arial,sans-serif" font-size="38" font-weight="700">Tres aproximaciones al minimalismo</text><text x="56" y="163" fill="#b9aabe" font-family="Arial,sans-serif" font-size="19">Ejes descritos en las entradas de análisis; no es una evaluación de eficacia.</text>
<g font-family="Arial,sans-serif"><rect x="48" y="205" width="350" height="400" rx="20" fill="#241829" stroke="#c178e8" stroke-width="2"/><rect x="425" y="205" width="350" height="400" rx="20" fill="#201b2a" stroke="#8d7dda" stroke-width="2"/><rect x="802" y="205" width="350" height="400" rx="20" fill="#1b2226" stroke="#85b5a6" stroke-width="2"/>
<text x="78" y="252" fill="#d6a5f2" font-size="16" font-weight="700" letter-spacing="2">01 · KONMARI</text><text x="78" y="292" fill="#fff" font-size="28" font-weight="700">Relación afectiva</text><text x="78" y="335" fill="#e6dbe9" font-size="19"><tspan x="78">Decidir qué conservar según</tspan><tspan x="78" dy="28">la alegría que despierta.</tspan></text><line x1="78" y1="400" x2="368" y2="400" stroke="#563767"/><text x="78" y="444" fill="#d6a5f2" font-size="17" font-weight="700">ORGANIZACIÓN</text><text x="78" y="478" fill="#e6dbe9" font-size="18"><tspan x="78">Cinco categorías:</tspan><tspan x="78" dy="26">ropa, libros, papeles, komono</tspan><tspan x="78" dy="26">y objetos sentimentales.</tspan></text><text x="78" y="572" fill="#b9aabe" font-size="16">Gratitud · bienestar emocional</text>
<text x="455" y="252" fill="#b9b0f0" font-size="16" font-weight="700" letter-spacing="2">02 · BECOMING MINIMALIST</text><text x="455" y="292" fill="#fff" font-size="28" font-weight="700">Acción práctica</text><text x="455" y="335" fill="#e0dceb" font-size="19"><tspan x="455">Reducir lo excesivo y orientar</tspan><tspan x="455" dy="28">las decisiones hacia un propósito.</tspan></text><line x1="455" y1="400" x2="745" y2="400" stroke="#464066"/><text x="455" y="444" fill="#b9b0f0" font-size="17" font-weight="700">ORGANIZACIÓN</text><text x="455" y="478" fill="#e0dceb" font-size="18"><tspan x="455">Despeje por habitaciones y</tspan><tspan x="455" dy="26">prácticas de mantenimiento.</tspan></text><text x="455" y="572" fill="#b9aabe" font-size="16">Claridad · vida con propósito</text>
<text x="832" y="252" fill="#a8d3c4" font-size="16" font-weight="700" letter-spacing="2">03 · FUMIO SASAKI</text><text x="832" y="292" fill="#fff" font-size="28" font-weight="700">Simplicidad interior</text><text x="832" y="335" fill="#dce6e1" font-size="19"><tspan x="832">Reducir pertenencias y decisiones</tspan><tspan x="832" dy="28">para vivir con mayor intención.</tspan></text><line x1="832" y1="400" x2="1122" y2="400" stroke="#394b46"/><text x="832" y="444" fill="#a8d3c4" font-size="17" font-weight="700">ORGANIZACIÓN</text><text x="832" y="478" fill="#dce6e1" font-size="18"><tspan x="832">Rutinas simples y atención a</tspan><tspan x="832" dy="26">la función real de los objetos.</tspan></text><text x="832" y="572" fill="#b9aabe" font-size="16">Desapego · libertad interior</text></g><text x="56" y="654" fill="#9b8ba2" font-family="Arial,sans-serif" font-size="15">Resumen elaborado a partir de las descripciones de esta entrada. Los enfoques no se presentan como equivalentes.</text></svg>